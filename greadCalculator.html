<script>
    function submit() {
        let marks = document.getElementById("marks").value;
        console.log(marks)
        document.getElementById("result").innerText = marks;
        if (marks >= 80 && marks <= 100){
            console.log("you have grade A- party de aata ");}
        else if (marks >= 50 && marks < 79){
            console.log(" you have grade B-good good ");}
        else if (marks < 39 && marks > 15){
            console.log("c grade - bhaii kathawr pass zala tu");}
        else if (marks <=15){
            console.log("fail hai tu..stupid ");}
        else if (marks > 100){
            console.log("not valid");}
    }
</script>

<body>
    <label>Enter marks</label>
    <input id="marks" type="text" />
    <button onclick="submit()">submit</button>
    <div id="result"></div>
</body>

</html>
